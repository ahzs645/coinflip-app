<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Coin Flip</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8c766' stroke='%23b8912f' stroke-width='2'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Georgia,serif' font-weight='bold' text-anchor='middle' fill='%238a6a1e'%3E25%3C/text%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8c766'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Coin Flip</h1>
        <div class="picker" id="coin-picker" role="radiogroup" aria-label="Coin">
          <button type="button" role="radio" data-coin="ca" aria-checked="true">
            Canadian
          </button>
          <button type="button" role="radio" data-coin="us" aria-checked="false">
            American
          </button>
        </div>
      </header>

      <main id="stage">
        <p id="hint">Click the coin to flip</p>
        <p id="status" data-face=""></p>
      </main>

      <footer>
        <div class="tally" id="tally-heads">
          <span class="label">Heads</span>
          <span class="count">0</span>
        </div>
        <div class="tally" id="tally-tails">
          <span class="label">Tails</span>
          <span class="count">0</span>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
